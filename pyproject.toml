[project]
name = "pronostico-demanda-electrica"
version = "0.1.0"
description = "Pronóstico mensual de demanda eléctrica por región de México con datos de CENACE"
readme = "README.md"
authors = [
    { name = "Jesus-Flores", email = "jaflores9891@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.1.3",
]

[project.scripts]
pronostico-demanda-electrica = "pronostico_demanda_electrica:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
